name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag or branch)'
        required: false
        default: ''

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        run: bun run lint

  osint-skill-checks:
    name: OSINT Skill Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check SKILL.md line count
        run: |
          LINES=$(wc -l < skills/osint/SKILL.md)
          echo "SKILL.md has $LINES lines"
          if [ $LINES -gt 500 ]; then
            echo "❌ FAIL: SKILL.md exceeds 500 lines ($LINES)"
            exit 1
          else
            echo "✅ PASS: SKILL.md is under 500 lines ($LINES)"
          fi

      - name: Check YAML frontmatter
        run: |
          if head -20 skills/osint/SKILL.md | grep -q "^name:"; then
            echo "✅ PASS: Valid YAML frontmatter"
          else
            echo "❌ FAIL: Missing YAML frontmatter"
            exit 1
          fi

      - name: Check skill name is lowercase
        run: |
          if grep -q "^name: osint$" skills/osint/SKILL.md; then
            echo "✅ PASS: Skill name is lowercase"
          else
            echo "❌ FAIL: Skill name must be 'osint' (lowercase)"
            exit 1
          fi

      - name: Validate AgentProfiles.yaml
        run: |
          python3 -c "import yaml; yaml.safe_load(open('skills/osint/AgentProfiles.yaml'))"
          echo "✅ PASS: AgentProfiles.yaml is valid YAML"

      - name: Validate plugin manifests
        run: |
          python3 - <<'EOF'
          import json, re
          p = json.load(open('.claude-plugin/plugin.json'))
          assert re.fullmatch(r'[a-z0-9]+(-[a-z0-9]+)*', p['name']), 'plugin name must be kebab-case'
          assert re.fullmatch(r'\d+\.\d+\.\d+', p['version']), 'plugin version must be semver'
          m = json.load(open('.claude-plugin/marketplace.json'))
          assert m['plugins'][0]['name'] == p['name'], 'marketplace/plugin name mismatch'
          assert m['plugins'][0]['source'] == './', 'single-repo plugin sources from ./'
          print('✅ PASS: plugin manifests valid —', p['name'], p['version'])
          EOF

      - name: Validate plugin agent definitions
        run: |
          python3 - <<'EOF'
          import os, re

          agents_dir = 'agents'
          assert os.path.isdir(agents_dir), 'plugin must ship an agents/ directory'
          files = sorted(f for f in os.listdir(agents_dir) if f.endswith('.md'))
          assert len(files) == 6, f'expected exactly six agent definitions, found {len(files)}: {files}'

          for fname in files:
              path = os.path.join(agents_dir, fname)
              lines = open(path, encoding='utf-8').read().splitlines()
              assert lines and lines[0] == '---', f'{fname}: frontmatter must open with --- on line 1'
              try:
                  end = lines.index('---', 1)
              except ValueError:
                  raise AssertionError(f'{fname}: frontmatter block is never closed')

              fm = {}
              for line in lines[1:end]:
                  if ': ' in line:
                      key, value = line.split(': ', 1)
                      fm[key.strip()] = value.strip()

              name = fm.get('name')
              assert name and re.fullmatch(r'[a-z0-9]+(-[a-z0-9]+)*', name), \
                  f'{fname}: name must be lowercase-hyphens, got {name!r}'
              description = fm.get('description')
              assert description and description.strip(), f'{fname}: description is required'
              tools = fm.get('tools')
              assert tools, f'{fname}: tools is required'
              assert all(re.fullmatch(r'[A-Za-z0-9_]+', t.strip()) and t.strip()
                         for t in tools.split(',')), \
                  f'{fname}: tools must be a comma-separated string of tool names, got {tools!r}'
              print(f'✅ {fname} — name={name}, tools={tools}')

          print('✅ PASS: plugin ships six valid agent definitions')
          EOF

      - name: Check all 17 workflows exist
        run: |
          WORKFLOWS="UsernameRecon DomainRecon SocialCapture InfraMapping EntityLinking TimelineAnalysis TargetProfile IntelReport CompanyProfile CorporateStructure FinancialRecon CompetitorAnalysis RiskAssessment EmailRecon PhoneRecon ImageRecon InvestigationOrchestrator"
          for wf in $WORKFLOWS; do
            if [ -f "skills/osint/Workflows/${wf}.md" ]; then
              echo "✅ ${wf}.md"
            else
              echo "❌ ${wf}.md MISSING"
              exit 1
            fi
          done

      - name: Check voice markers in workflows
        run: |
          MISSING=0
          for f in skills/osint/Workflows/*.md; do
            if grep -q '🗣️' "$f"; then
              echo "✅ $(basename "$f") has voice markers"
            else
              echo "⚠️  $(basename "$f") missing voice markers"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "⚠️  $MISSING workflow(s) missing voice markers"
          fi

      - name: Check documentation files
        run: |
          DOCS="USER_GUIDE.md QUICK_REFERENCE.md COMPANY_RESEARCH.md CHANGELOG.md AGENT_ROLES.md VOICE_MAPPINGS.md"
          for doc in $DOCS; do
            if [ -f "docs/$doc" ]; then
              echo "✅ docs/$doc"
            else
              echo "⚠️  docs/$doc missing"
            fi
          done

  agent-definitions:
    name: Agent Definitions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Regenerate agents and fail on drift
        run: |
          bun run generate:agents
          if git diff --exit-code agents/; then
            echo "✅ PASS: agents/ is byte-identical to generator output"
          else
            echo "❌ FAIL: agents/ differs from generator output — run 'bun run generate:agents' and commit the result"
            exit 1
          fi

      # Strongest unauthenticated host-side check: run the real Claude Code
      # plugin validator (offline, no credentials) over the plugin shape.
      - name: Install Claude Code CLI
        run: |
          # bun's global installer blocks postinstall scripts until trusted
          bun install -g @anthropic-ai/claude-code
          bun pm -g trust @anthropic-ai/claude-code
          bun install -g @anthropic-ai/claude-code
          claude --version

      - name: Validate plugin agents with the Claude Code validator
        run: |
          # `claude plugin validate` inspects agents/ only for a plugin-only
          # directory — a marketplace.json beside plugin.json redirects the
          # validation to the marketplace manifest instead. Stage a
          # plugin-only view of the repo.
          STAGE="$(mktemp -d)/plugin"
          mkdir -p "$STAGE/.claude-plugin" "$STAGE/agents"
          cp .claude-plugin/plugin.json "$STAGE/.claude-plugin/"
          cp agents/*.md "$STAGE/agents/"
          # Fresh HOME: the validator must run fully offline and unauthenticated.
          FRESH_HOME="$(mktemp -d)"
          HOME="$FRESH_HOME" claude plugin validate "$STAGE" --strict

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Run TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ''
          head: HEAD
          extra_args: --only-verified

  typescript-tests:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    needs: [lint, osint-skill-checks]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: cd src/tools && CI=true bun test
        env:
          CI: 'true'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, security, typescript-tests, agent-definitions]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build TypeScript
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      # Build documentation (validate only)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Build documentation
        run: mkdocs build

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: site/

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: changelog-update
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog for this release
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Update full CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Save generated CHANGELOG.md before switching branches
          cp CHANGELOG.md /tmp/CHANGELOG.md
          # Discard local changes so we can switch branches
          git checkout -- CHANGELOG.md
          # Checkout main to apply changelog update (tag checkout is detached HEAD)
          git fetch origin main
          git checkout main
          # Restore the generated CHANGELOG.md
          cp /tmp/CHANGELOG.md CHANGELOG.md
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update CHANGELOG.md for ${{ github.ref_name }} [skip ci]"
          git push origin main
          # Return to tag for subsequent build steps
          git checkout ${{ github.ref_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish documentation to GitHub Pages
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: ./site

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Disable Jekyll processing (mkdocs output is fully static)
        run: touch ./site/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages

  update-unreleased:
    name: Update Unreleased Changes
    runs-on: ubuntu-latest
    needs: [build]
    # Run on pushes to main (not tags, not PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: changelog-update
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for unreleased changes
        id: check
        run: |
          # Check if there are commits since the last tag
          if git describe --tags --abbrev=0 2>/dev/null; then
            LAST_TAG=$(git describe --tags --abbrev=0)
            COMMITS=$(git rev-list ${LAST_TAG}..HEAD --count)
            echo "commits=$COMMITS" >> $GITHUB_OUTPUT
          else
            echo "commits=1" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog with unreleased
        if: steps.check.outputs.commits != '0'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit and push changelog
        if: steps.check.outputs.commits != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update CHANGELOG.md [skip ci]"
          git push
